name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'internal/ui/assets/logo.svg'
      - 'internal/ui/assets/icon.svg'
      - 'assets/screenshot.png'
      - '.github/scripts/prepare_website.sh'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'internal/ui/assets/logo.svg'
      - 'internal/ui/assets/icon.svg'
      - 'assets/screenshot.png'
      - '.github/scripts/prepare_website.sh'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Prepare website
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare shared assets
        run: bash .github/scripts/prepare_website.sh

      - name: Add analytics for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          awk '
            /<\/head>/ {
              print "  <script defer src=\"https://analytics.lucor.dev/script.js\" data-website-id=\"d5a841a1-eccb-42c1-b37d-7590eee479ed\"></script>"
            }
            { print }
          ' website/index.html > website/index.html.tmp
          mv website/index.html.tmp website/index.html

      - name: Upload website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
