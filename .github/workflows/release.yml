name: Build packages and release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: read

jobs:
  verify-ci:
    name: Verify tag passed CI on main
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          }

      - name: Verify successful CI run for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&branch=main&event=push&status=completed&per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"main\" and .event == \"push\" and .status == \"completed\" and .conclusion == \"success\")] | length")

          if [[ "$successful_runs" -eq 0 ]]; then
            echo "No successful CI run on main found for $GITHUB_SHA" >&2
            exit 1
          fi

  package-linux:
    name: Package Linux / ${{ matrix.arch }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: true

      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libxi-dev libxxf86vm-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev

      - name: Download Go dependencies
        run: go mod download

      - name: Build Linux package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name FyneTune \
            --app-id dev.lucor.fynetune --icon Icon.png \
            --app-version "$PACKAGE_VERSION" --release
          mv FyneTune.tar.xz "FyneTune_${PACKAGE_VERSION}_linux_${GOARCH}.tar.xz"

      - name: Upload Linux package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FyneTune-linux-${{ matrix.arch }}
          path: dist/FyneTune_*.tar.xz
          if-no-files-found: error

  package-windows:
    name: Package Windows / amd64
    needs: verify-ci
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: amd64
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: true

      - name: Install Windows compiler
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-pkgconf

      - name: Configure Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $compilerBin = Join-Path $env:MSYS_LOCATION 'ucrt64/bin'
          $compilerBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$(Join-Path $compilerBin 'gcc.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Go dependencies
        run: go mod download

      - name: Build Windows package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name FyneTune \
            --app-id dev.lucor.fynetune --icon Icon.png \
            --app-version "$PACKAGE_VERSION" --release

      - name: Name Windows executable
        shell: pwsh
        run: Move-Item FyneTune.exe "dist/FyneTune_${env:PACKAGE_VERSION}_windows_${env:GOARCH}.exe"

      - name: Upload Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FyneTune-windows-amd64
          path: dist/FyneTune_*.exe
          if-no-files-found: error

  package-macos:
    name: Package macOS / ${{ matrix.arch }}
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '1'
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: true

      - name: Download Go dependencies
        run: go mod download

      - name: Build macOS package
        run: |
          mkdir -p dist
          cd dist
          go tool fyne package --source-dir .. --name FyneTune \
            --app-id dev.lucor.fynetune --icon Icon.png \
            --app-version "$PACKAGE_VERSION" --release

      - name: Create macOS disk image
        run: |
          codesign --force --deep --sign - dist/FyneTune.app
          codesign --verify --deep --strict dist/FyneTune.app
          mkdir -p dist/dmg
          cp -R dist/FyneTune.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname FyneTune -srcfolder dist/dmg -ov -format UDZO \
            "dist/FyneTune_${PACKAGE_VERSION}_darwin_${GOARCH}.dmg"

      - name: Upload macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FyneTune-macos-${{ matrix.arch }}
          path: dist/FyneTune_*.dmg
          if-no-files-found: error

  package-freebsd:
    name: Package FreeBSD / ${{ matrix.go_arch }} in fyne-cross image
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_arch: amd64
            go_arch: amd64
            target: x86_64-unknown-freebsd12
            cgo_ldflags: ''
          - image_arch: arm64
            go_arch: arm64
            target: aarch64-unknown-freebsd12
            cgo_ldflags: -fuse-ld=lld
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GO_VERSION: '1.26.10'
      FYNE_CROSS_IMAGES_VERSION: v1.3.2
      GOOS: freebsd
      GOARCH: ${{ matrix.go_arch }}
      CGO_ENABLED: '1'
      CC: clang --sysroot=/freebsd --target=${{ matrix.target }}
      CXX: clang++ --sysroot=/freebsd --target=${{ matrix.target }}
      CGO_LDFLAGS: ${{ matrix.cgo_ldflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: |
          echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build package with fyne-cross image
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/app" \
            --workdir /app \
            --env PACKAGE_VERSION \
            --env GOOS \
            --env GOARCH \
            --env CGO_ENABLED \
            --env "GOTOOLCHAIN=go$GO_VERSION" \
            --env CC \
            --env CXX \
            --env CGO_LDFLAGS \
            "fyneio/fyne-cross-images:${FYNE_CROSS_IMAGES_VERSION}-freebsd-${{ matrix.image_arch }}" \
            sh -euc '
            go version
            clang --version
            go mod download
            mkdir -p dist
            cd dist
            fyne package \
              --source-dir .. --name FyneTune --app-id dev.lucor.fynetune \
              --icon Icon.png --app-version "$PACKAGE_VERSION" \
              --tags x11 --release
            mv FyneTune.tar.xz "FyneTune_${PACKAGE_VERSION}_freebsd_${GOARCH}.tar.xz"
            '

      - name: Upload FreeBSD package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FyneTune-freebsd-${{ matrix.go_arch }}
          path: dist/FyneTune_*.tar.xz
          if-no-files-found: error

  package-android:
    name: Package Android APK
    needs: verify-ci
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: '1'
      ANDROID_PLATFORM: android-36
      ANDROID_BUILD_TOOLS: '36.0.0'
      ANDROID_NDK_VERSION: '30.0.16248370'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set package version from tag
        run: echo "PACKAGE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Set up the minimum supported Go release
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.10'
          check-latest: true

      - name: Configure Java and Android SDK
        run: |
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager" ]]; then
            echo "sdkmanager was not found under $ANDROID_HOME/cmdline-tools" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          dirname "$sdkmanager" >> "$GITHUB_PATH"

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "platforms;$ANDROID_PLATFORM" \
            "build-tools;$ANDROID_BUILD_TOOLS" "ndk;$ANDROID_NDK_VERSION"

      - name: Download pinned dependencies
        run: go mod download

      - name: Build Android APK with Fyne Tool
        run: |
          mkdir -p dist
          # Fyne's --release mode produces an AAB; APKs use development signing.
          go tool fyne package --os android --name FyneTune \
            --app-id dev.lucor.fynetune --icon Icon.png \
            --app-version "$PACKAGE_VERSION"
          mv FyneTune.apk "dist/FyneTune_${PACKAGE_VERSION}_android.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FyneTune-android
          path: dist/FyneTune_*_android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [package-linux, package-windows, package-macos, package-freebsd, package-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/fynetune-release-assets
          merge-multiple: true

      - name: Publish release with GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
