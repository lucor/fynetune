[tools]
go = "1.27.2"
java = "21"
android-sdk = "23.0"
# CLI tools used to render and optimize the generated Lucide PNG icons.
resvg = "0.48.1"
oxipng = "10.2.1"

[env]
ANDROID_PLATFORM = "android-36"
ANDROID_BUILD_TOOLS = "36.0.0"
ANDROID_NDK_VERSION = "30.0.16248370"

[tasks.setup]
description = "Download Go module dependencies"
run = "go mod download"

[tasks.start]
description = "Start FyneTune from source"
run = "go run ."

[tasks.website-build]
description = "Prepare shared assets for the static website"
run = "bash .github/scripts/prepare_website.sh"

[tasks.website-preview]
description = "Preview the website at http://127.0.0.1:8000"
depends = ["website-build"]
run = "python3 -m http.server 8000 --bind 127.0.0.1 --directory website"

[tasks.start-debug]
description = "Start FyneTune from source with debug logs enabled"
run = "go run ."
env = { FYNETUNE_DEBUG = "1" }

[tasks.fmt]
description = "Format Go source files"
run = "go fmt ./..."

[tasks.lint]
description = "Run Go static checks"
run = ["go vet ./...", "go tool staticcheck ./..."]

[tasks.vuln]
description = "Check Go dependencies and packages for known vulnerabilities"
run = "go tool govulncheck ./..."

[tasks.test]
description = "Run unit tests"
run = "go test ./..."

[tasks.test-race]
description = "Run unit tests with the race detector"
run = "go test -race ./..."

[tasks.build]
description = "Build the FyneTune desktop application"
run = "mkdir -p dist && go build -trimpath -o dist/fynetune ."

[tasks.licenses]
description = "Generate third-party license notices from the Go module"
run = "go tool lian --dump -o THIRD_PARTY_LICENSES go.mod"

[tasks.fyne-build]
description = "Build FyneTune with Fyne application metadata embedded"
run = "mkdir -p dist && go tool fyne build --source-dir . --output dist/fynetune"

[tasks.package]
description = "Create a development package for the current desktop operating system"
run = "mkdir -p dist && cd dist && go tool fyne package --source-dir .. --name FyneTune --app-id dev.lucor.fynetune --icon Icon.png"

[tasks.generate-icons]
description = "Download Lucide SVGs and regenerate optimized FyneTune PNG icon assets"
run = "bash internal/ui/assets/icons/generate-icons.sh"

[tasks.check]
description = "Run formatting, analysis, tests, vulnerability check, and build"
depends = ["fmt", "lint", "vuln", "test", "build"]

[tasks.android-setup]
description = "Install Android SDK components required by Fyne"
run = """
set -eu
sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(mise where android-sdk)}}"
export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
android --no-metrics --sdk="$sdk_root" sdk install "platform-tools"
android --no-metrics --sdk="$sdk_root" sdk install "platforms;${ANDROID_PLATFORM}"
android --no-metrics --sdk="$sdk_root" sdk install "build-tools;${ANDROID_BUILD_TOOLS}"
android --no-metrics --sdk="$sdk_root" sdk install "ndk;${ANDROID_NDK_VERSION}"
"""

[tasks.android-dex]
description = "Compile the Android playback service to dist/fynetune.dex"
depends = ["android-setup"]
run = """
set -eu
sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(mise where android-sdk)}}"
export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
android_jar="$sdk_root/platforms/${ANDROID_PLATFORM}/android.jar"
mkdir -p dist/service-classes dist/service-dex
javac -source 8 -target 8 -classpath "$android_jar" \
  -d dist/service-classes internal/android/PlaybackService.java
jar cf dist/PlaybackService.jar \
  -C dist/service-classes dev/lucor/fynetune/android/PlaybackService.class
"$sdk_root/build-tools/${ANDROID_BUILD_TOOLS}/d8" --lib "$android_jar" --min-api 21 \
  --output dist/service-dex dist/PlaybackService.jar
mv dist/service-dex/classes.dex dist/fynetune.dex
"""

[tasks.package-android]
description = "Package a development APK to dist/FyneTune.apk"
depends = ["android-dex"]
run = """
set -eu
sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(mise where android-sdk)}}"
export ANDROID_HOME="$sdk_root" ANDROID_SDK_ROOT="$sdk_root"
export ANDROID_NDK_HOME="$sdk_root/ndk/${ANDROID_NDK_VERSION}"
mkdir -p dist
cp internal/android/icon-foreground.png Icon-foreground.png
cp internal/android/icon-background.png Icon-background.png
go tool fyne package --os android --name FyneTune \
  --app-id dev.lucor.fynetune --icon Icon.png --android-dex dist/fynetune.dex
mv FyneTune.apk dist/FyneTune.apk
"""
